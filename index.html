<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Northstar">
<link rel="manifest" href="./manifest.json">
<title>Northstar — Life Tracker</title>
<style>
:root{--bg:#090e1b;--panel:#111a2d;--panel2:#17233a;--line:#263550;--text:#eef4ff;--muted:#9aabc5;--accent:#7ce0bd;--accent2:#83a9ff;--danger:#ff7d91;--gold:#f4ca78;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#1c3150 0,transparent 45%),var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;padding:18px 15px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#7ce0bd,#83a9ff);display:grid;place-items:center;color:#091321;font-weight:900;font-size:23px}.brand h1{font-size:20px;margin:0;letter-spacing:.3px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;margin-top:3px}.date{color:var(--muted);font-size:12px;text-align:right}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#0c1424ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));overflow:auto}
nav button{background:none;border:0;color:var(--muted);font-size:10px;min-width:62px;padding:4px 5px}nav button span{display:block;font-size:19px;margin-bottom:3px}nav button.active{color:var(--accent)}
h2{font-size:22px;margin:4px 0 15px}h3{font-size:15px;margin:0 0 12px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:linear-gradient(145deg,var(--panel),#0f1728);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;min-width:0}.stat{font-size:25px;font-weight:750;margin:6px 0}.statlabel{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px}.btn.primary{background:var(--accent);color:#07151b;border-color:var(--accent);font-weight:700}.btn.danger{color:var(--danger)}.btn.ghost{background:transparent}.btn:disabled{opacity:.4}
input,select,textarea{width:100%;background:#0b1425;border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:11px;min-width:0}textarea{min-height:76px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.formgrid .full{grid-column:1/-1}
.pill{font-size:11px;border-radius:99px;padding:5px 9px;background:#1c3045;color:var(--accent)}.task{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}.task.done .taskname{text-decoration:line-through;color:var(--muted)}.taskname{flex:1;min-width:0;overflow-wrap:anywhere}
.exercise{border-top:1px solid var(--line);padding:13px 0}.exercise:first-child{border:0}.setrow{display:grid;grid-template-columns:45px 1fr 1fr 50px;gap:7px;align-items:center;margin:7px 0}.setrow input{padding:9px 7px}.last{font-size:12px;color:var(--muted);background:#0b1425;padding:8px 10px;border-radius:10px;margin:7px 0}.historyitem{padding:10px 0;border-bottom:1px solid var(--line)}.historyitem:last-child{border:0}
canvas{width:100%;height:190px;display:block}.bar{height:8px;background:#263550;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.photo{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px}.hidden{display:none!important}.empty{color:var(--muted);text-align:center;padding:22px 5px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.tableline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.timer{font-size:42px;font-weight:800;text-align:center;letter-spacing:2px;margin:8px}.notice{padding:10px 12px;border-radius:12px;background:#193044;color:#b9f5df;font-size:12px;margin:10px 0}
@media(min-width:700px){.app{padding:28px 24px 40px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}nav{left:50%;transform:translateX(-50%);width:min(900px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.wide2{grid-column:span 2}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Northstar</h1><small>YOUR PERSONAL LIFE SYSTEM</small></div></div><div class="date" id="todayLabel"></div></header>
<main id="view"></main>
</div>
<nav id="nav"></nav>
<script>
const $=id=>document.getElementById(id);
const KEY='northstar_v3_data';
const today=()=>new Date().toISOString().slice(0,10);
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const uid=()=>Math.random().toString(36).slice(2,10);
const defaultTasks=['Drink water regularly','Complete planned training or recovery','Revise for GCSEs','Prepare for tomorrow','Record today’s progress'];
const plans={
Monday:{title:'Boxing',items:[]},
Tuesday:{title:'Back + Biceps + Triceps',items:[['Lat pulldown',3,'8–12',120],['Chest-supported row',3,'8–12',120],['Single-arm lat pulldown',2,'10–12',90],['Reverse pec deck',2,'12–15',75],['Preacher curl',3,'8–12',90],['Incline dumbbell curl',2,'10–12',90],['Overhead cable triceps extension',2,'10–15',90],['Triceps pushdown',2,'10–15',90]]},
Wednesday:{title:'Boxing',items:[]},
Thursday:{title:'Chest + Shoulders + Triceps',items:[['Bench press',3,'6–10',150],['Incline dumbbell press',2,'8–12',120],['Pec deck',2,'12–15',90],['Shoulder press',2,'8–12',120],['Lateral raises',3,'12–20',75],['Overhead cable triceps extension',3,'10–15',90],['Triceps pushdown',2,'10–15',90]]},
Friday:{title:'Boxing',items:[]},
Saturday:{title:'Legs + Core',items:[['Box jumps (only if fresh)',3,'5',105],['Leg press',3,'8–12',150],['Leg extension',2,'10–15',90],['Seated leg curl',3,'10–15',90],['Hip abductor',2,'12–15',75],['Calf raises',3,'12–20',75],['Captain’s chair leg raises',3,'10–15',75],['Weighted decline sit-ups',2,'10–15',75]]},
Sunday:{title:'Chest + Arms + Shoulders',items:[['Incline dumbbell press',2,'8–12',120],['Lateral raises',2,'12–20',75],['Reverse pec deck',3,'12–15',75],['Preacher curls',2,'10–12',90],['Hammer curls',2,'10–15',90],['Overhead triceps extensions',2,'10–15',90],['Triceps pushdowns',2,'10–15',90]]}
};
let db;
function fresh(){return {tasks:{},gym:[],boxing:[],runs:[],sleep:[],water:{},meals:[],goals:[],measurements:[],study:[],spending:[],events:[],notes:[]}}
function load(){try{db={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){db=fresh()} }
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function tasksToday(){if(!db.tasks[today()])db.tasks[today()]=defaultTasks.map(name=>({id:uid(),name,done:false}));return db.tasks[today()]}
let page='Home',selectedDay=new Date().toLocaleDateString('en-US',{weekday:'long'});
const navItems=[['Home','⌂'],['Gym','🏋'],['Boxing','🥊'],['Running','🏃'],['Nutrition','🍽'],['Habits','✓'],['Goals','◎'],['Calendar','▦'],['Sleep','☾'],['Study','📚'],['Measurements','📏'],['Spending','£'],['Reports','▤']];
function go(p){page=p;render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(title,body,extra=''){return `<section class="card ${extra}"><h3>${title}</h3>${body}</section>`}
function field(label,id,type='text',placeholder='',value=''){return `<label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}">`}
function addTask(){let v=$('newTask').value.trim();if(!v)return;tasksToday().push({id:uid(),name:v,done:false});save()}
function taskToggle(id,checked){let t=tasksToday().find(x=>x.id===id);if(t)t.done=checked;persistRender()}
function taskEdit(id){let t=tasksToday().find(x=>x.id===id);if(!t)return;let v=prompt('Edit task',t.name);if(v===null)return;if(!v.trim())return alert('Enter a task name or delete it.');t.name=v.trim();save()}
function taskDelete(id){if(!confirm('Delete this task?'))return;db.tasks[today()]=tasksToday().filter(x=>x.id!==id);save()}
function persistRender(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function home(){let done=tasksToday().filter(x=>x.done).length,water=db.water[today()]||0,week=db.gym.filter(x=>withinWeek(x.date)).length;
return `<h2>Today</h2><div class="grid">
${card('Daily tasks',`<div class="stat">${done}/${tasksToday().length}</div><div class="bar"><i style="width:${tasksToday().length?done/tasksToday().length*100:0}%"></i></div><p class="muted small">Keep your day moving</p>`)}
${card('Water',`<div class="stat">${water.toFixed(1)} L</div><div class="row"><button class="btn" onclick="waterAdd(-.25)">−</button><button class="btn primary" onclick="waterAdd(.25)">+ 250 ml</button></div>`)}
${card('Gym sessions',`<div class="stat">${week}</div><span class="muted small">Logged this week</span>`)}
${card('Personal records',`<div class="stat">${Object.keys(prs()).length}</div><span class="muted small">Exercises with records</span>`)}
</div>${card('Today’s checklist',taskPanel())}${card('Today’s plan',`<b>${esc(plans[new Date().toLocaleDateString('en-US',{weekday:'long'})]?.title||'Personal day')}</b><p class="muted small">Open Gym or Boxing to record your session.`)}${card('Quick add',`<div class="row wrap"><button class="btn" onclick="go('Gym')">Log gym</button><button class="btn" onclick="go('Nutrition')">Add meal</button><button class="btn" onclick="go('Boxing')">Log boxing</button><button class="btn" onclick="go('Running')">Log run</button></div>`)}`}
function taskPanel(){return `<div id="taskList">${tasksToday().map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="taskToggle('${t.id}',this.checked)"><span class="taskname">${esc(t.name)}</span><button class="btn ghost small" onclick="taskEdit('${t.id}')">Edit</button><button class="btn danger small" onclick="taskDelete('${t.id}')">Delete</button></div>`).join('')||'<div class="empty">No tasks today. Add one below.</div>'}</div><div class="row" style="margin-top:10px"><input id="newTask" placeholder="Add a daily task"><button class="btn primary" onclick="addTask()">Add</button></div>`}
function withinWeek(d){let x=new Date(d+'T12:00:00'),n=new Date();let start=new Date(n);start.setDate(n.getDate()-((n.getDay()+6)%7));start.setHours(0,0,0,0);return x>=start}
function gym(){let day=selectedDay,plan=plans[day],prev=[...db.gym].reverse().find(s=>s.day===day);
let exercises=plan.items.map((it,i)=>{let [name,sets,reps,rest]=it;let old=prev?.entries.filter(e=>e.exercise===name)||[];return `<div class="exercise"><div class="row between"><b>${esc(name)}</b><span class="pill">${sets} × ${reps}</span></div><div class="last"><b>Last session:</b> ${old.length?old.map(e=>`Set ${e.set}: ${e.weight||'—'} kg × ${e.reps||'—'} reps`).join(' · '):'No previous session recorded'}</div>${Array.from({length:sets},(_,s)=>`<div class="setrow"><span class="muted small">Set ${s+1}</span><input id="w_${i}_${s}" type="number" min="0" step=".5" placeholder="kg"><input id="r_${i}_${s}" type="number" min="0" step="1" placeholder="reps"><button class="btn small" onclick="startTimer(${rest})">${rest>=60?Math.floor(rest/60)+'m'+(rest%60?rest%60+'s':''):rest+'s'}</button></div>`).join('')}</div>`}).join('');
return `<h2>Gym tracker</h2><div class="card"><div class="formgrid"><div><label>Workout day</label><select id="gymDay" onchange="selectedDay=this.value;render()">${Object.keys(plans).map(d=>`<option ${d===day?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Session date</label><input id="gymDate" type="date" value="${today()}"></div></div><h3 style="margin-top:15px">${esc(plan.title)}</h3>${plan.items.length?`<div class="notice">Previous session is shown above each exercise. Record today’s weight and reps set by set.</div>${exercises}<button class="btn primary" style="width:100%;margin-top:12px" onclick="saveGym()">Save workout</button>`:`<p class="muted">Boxing day — log rounds in the Boxing section.</p>`}</div>${card('Rest timer',`<div class="timer" id="timer">00:00</div><div class="row" style="justify-content:center"><button class="btn" onclick="pauseTimer()">Pause</button><button class="btn" onclick="resetTimer()">Reset</button></div>`)}${card('Recent gym sessions',gymHistory())}${card('Strength progress',`<label>Exercise</label><select id="graphExercise" onchange="drawGymChart()">${allExercises().map(x=>`<option>${esc(x)}</option>`).join('')}</select><canvas id="gymChart"></canvas>`)}`}
function allExercises(){return [...new Set(db.gym.flatMap(s=>s.entries.map(e=>e.exercise)))].sort()}
function gymHistory(){return db.gym.slice().reverse().slice(0,12).map(s=>`<div class="historyitem"><div class="row between"><b>${esc(s.day)}</b><span class="muted small">${esc(s.date)}</span></div>${s.entries.map(e=>`<div class="tableline"><span>${esc(e.exercise)} · set ${e.set}</span><b>${e.weight||'—'} kg × ${e.reps||'—'}</b></div>`).join('')}</div>`).join('')||'<div class="empty">No gym sessions saved yet.</div>'}
function saveGym(){let day=$('gymDay').value,plan=plans[day],entries=[];plan.items.forEach(([name,sets],i)=>{for(let s=0;s<sets;s++){let w=$(`w_${i}_${s}`)?.value,r=$(`r_${i}_${s}`)?.value;if(w!==''||r!=='')entries.push({exercise:name,set:s+1,weight:Number(w)||0,reps:Number(r)||0})}});if(!entries.length)return alert('Enter at least one set first.');db.gym.push({id:uid(),day,date:$('gymDate').value||today(),entries});save();alert('Workout saved. Your next session will show these weights and reps.')}
let timerInterval=null,timerLeft=0;
function startTimer(s){clearInterval(timerInterval);timerLeft=s;showTimer();timerInterval=setInterval(()=>{timerLeft--;showTimer();if(timerLeft<=0){clearInterval(timerInterval);timerInterval=null;if(navigator.vibrate)navigator.vibrate([180,100,180]);}},1000)}
function showTimer(){let el=$('timer');if(el)el.textContent=`${String(Math.floor(timerLeft/60)).padStart(2,'0')}:${String(timerLeft%60).padStart(2,'0')}`}
function pauseTimer(){clearInterval(timerInterval);timerInterval=null}function resetTimer(){pauseTimer();timerLeft=0;showTimer()}
function prs(){let result={};db.gym.forEach(s=>s.entries.forEach(e=>{if(!result[e.exercise]||e.weight>result[e.exercise].weight||(e.weight===result[e.exercise].weight&&e.reps>result[e.exercise].reps))result[e.exercise]={weight:e.weight,reps:e.reps,date:s.date}}));return result}
function drawGymChart(){let c=$('gymChart');if(!c)return;let ctx=c.getContext('2d'),name=$('graphExercise')?.value,series=db.gym.map(s=>({date:s.date,entries:s.entries.filter(e=>e.exercise===name)})).filter(x=>x.entries.length);c.width=c.clientWidth*devicePixelRatio;c.height=190*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.clearRect(0,0,c.width,c.height);if(!series.length){ctx.fillStyle='#9aabc5';ctx.fillText('Log sessions to see progress',12,30);return}let vals=series.map(s=>Math.max(...s.entries.map(e=>e.weight))),max=Math.max(...vals,1),min=Math.min(...vals,0),w=c.clientWidth,h=170;ctx.strokeStyle='#7ce0bd';ctx.lineWidth=2;ctx.beginPath();vals.forEach((v,i)=>{let x=12+i*(w-24)/Math.max(1,vals.length-1),y=h-15-(v-min)/(max-min||1)*(h-35);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);ctx.fillStyle='#7ce0bd';ctx.fillRect(x-3,y-3,6,6)});ctx.stroke();ctx.fillStyle='#9aabc5';ctx.font='11px sans-serif';ctx.fillText(`${name} · highest set weight (kg)`,10,12)}
function boxing(){return `<h2>Boxing tracker</h2>${card('Log a session',`<div class="formgrid">${field('Date','boxDate','date','',today())}${field('Rounds','boxRounds','number','e.g. 6')}${field('Round length (minutes)','boxLength','number','e.g. 2')}${field('Session duration (minutes)','boxDuration','number','')}${field('Focus','boxFocus','text','Footwork, speed, technique')}</div><label>Notes</label><textarea id="boxNotes" placeholder="What went well? What to practise next time?"></textarea><button class="btn primary" style="margin-top:10px" onclick="saveBox()">Save boxing session</button>`)}${card('History',db.boxing.slice().reverse().map(s=>`<div class="historyitem"><b>${esc(s.date)}</b> · ${s.rounds} rounds × ${s.length} min<div class="muted small">${esc(s.focus)} · ${esc(s.notes)}</div></div>`).join('')||'<div class="empty">No boxing sessions yet.</div>')}`}
function saveBox(){db.boxing.push({date:$('boxDate').value||today(),rounds:+$('boxRounds').value||0,length:+$('boxLength').value||0,duration:+$('boxDuration').value||0,focus:$('boxFocus').value,notes:$('boxNotes').value});save()}
function running(){return `<h2>Running tracker</h2>${card('Log a run',`<div class="formgrid">${field('Date','runDate','date','',today())}${field('Distance (km)','runDist','number','e.g. 3.2')}${field('Time (minutes)','runTime','number','')}${field('Notes','runNotes','text','Route or how it felt')}</div><button class="btn primary" style="margin-top:10px" onclick="saveRun()">Save run</button>`)}${card('Run history',db.runs.slice().reverse().map(s=>`<div class="tableline"><span>${esc(s.date)} · ${s.distance} km</span><b>${s.time} min</b></div>`).join('')||'<div class="empty">No runs logged yet.</div>')}`}
function saveRun(){db.runs.push({date:$('runDate').value||today(),distance:+$('runDist').value||0,time:+$('runTime').value||0,notes:$('runNotes').value});save()}
function waterAdd(n){db.water[today()]=Math.max(0,(db.water[today()]||0)+n);save()}
function habits(){return `<h2>Daily habits</h2>${card('Daily checklist',taskPanel())}${card('Water tracker',`<div class="stat">${(db.water[today()]||0).toFixed(2)} L</div><div class="row"><button class="btn" onclick="waterAdd(-.25)">− 250 ml</button><button class="btn primary" onclick="waterAdd(.25)">+ 250 ml</button><button class="btn" onclick="waterAdd(.5)">+ 500 ml</button></div><p class="muted small">Record what you drink; your total is saved by date.</p>`)}`}
function nutrition(){return `<h2>Nutrition & meals</h2>${card('Add meal',`<div class="formgrid">${field('Date','mealDate','date','',today())}${field('Meal name','mealName','text','Breakfast, lunch…')}${field('Protein (g)','mealP','number','')}${field('Carbs (g)','mealC','number','')}${field('Fat (g)','mealF','number','')}${field('Calories (kcal)','mealK','number','')}</div><label>Food photo (optional)</label><input id="mealPhoto" type="file" accept="image/*"><label>Notes / foods eaten</label><textarea id="mealNotes"></textarea><button class="btn primary" style="margin-top:10px" onclick="saveMeal()">Save meal</button><p class="muted small">Enter nutrition values from food labels or a trusted food database. Photo-only automatic macro recognition is not available offline.</p>`)}${card('Today’s totals',mealTotals())}${card('Meal history',db.meals.slice().reverse().map(m=>`<div class="historyitem"><b>${esc(m.name)}</b> · ${esc(m.date)}<div class="muted small">P ${m.p}g · C ${m.c}g · F ${m.f}g · ${m.k} kcal</div>${m.notes?`<div class="muted small">${esc(m.notes)}</div>`:''}${m.photo?`<img class="photo" src="${m.photo}" alt="Meal photo">`:''}</div>`).join('')||'<div class="empty">No meals saved yet.</div>')}`}
function mealTotals(){let a=db.meals.filter(m=>m.date===today());let sum=k=>a.reduce((n,m)=>n+(+m[k]||0),0);return `<div class="grid"><div><div class="stat">${sum('k')}</div><div class="statlabel">Calories</div></div><div><div class="stat">${sum('p')} g</div><div class="statlabel">Protein</div></div><div><div class="stat">${sum('c')} g</div><div class="statlabel">Carbs</div></div><div><div class="stat">${sum('f')} g</div><div class="statlabel">Fat</div></div></div>`}
function saveMeal(){let file=$('mealPhoto').files[0],base={date:$('mealDate').value||today(),name:$('mealName').value||'Meal',p:+$('mealP').value||0,c:+$('mealC').value||0,f:+$('mealF').value||0,k:+$('mealK').value||0,notes:$('mealNotes').value};if(file){let reader=new FileReader();reader.onload=()=>{base.photo=reader.result;db.meals.push(base);save()};reader.readAsDataURL(file)}else{db.meals.push(base);save()}}
function goals(){return `<h2>Personal goals</h2>${card('Create a goal',`${field('Goal','goalName','text','What do you want to achieve?')}${field('Target date','goalDate','date','')}${field('Progress (%)','goalProgress','number','0')}<button class="btn primary" style="margin-top:10px" onclick="saveGoal()">Add goal</button>`)}${card('Your goals',db.goals.map(g=>`<div class="historyitem"><div class="row between"><b>${esc(g.name)}</b><button class="btn danger small" onclick="removeItem('goals','${g.id}')">Delete</button></div><div class="bar"><i style="width:${Math.min(100,Math.max(0,g.progress))}%"></i></div><div class="muted small">${g.progress}% · ${g.date||'No target date'}</div><input type="range" min="0" max="100" value="${g.progress}" onchange="goalProgress('${g.id}',this.value)"></div>`).join('')||'<div class="empty">Add your first goal.</div>')}`}
function saveGoal(){db.goals.push({id:uid(),name:$('goalName').value,date:$('goalDate').value,progress:Math.min(100,Math.max(0,+$('goalProgress').value||0))});save()}
function goalProgress(id,v){let g=db.goals.find(x=>x.id===id);if(g)g.progress=+v;persistRender()}
function sleep(){return `<h2>Sleep tracker</h2>${card('Log sleep',`<div class="formgrid">${field('Date','sleepDate','date','',today())}${field('Bedtime','sleepBed','time','')}${field('Wake time','sleepWake','time','')}</div><button class="btn primary" style="margin-top:10px" onclick="saveSleep()">Save sleep</button>`)}${card('Sleep history',db.sleep.slice().reverse().map(s=>`<div class="tableline"><span>${esc(s.date)} · ${s.bed}–${s.wake}</span><b>${s.hours.toFixed(1)} h</b></div>`).join('')||'<div class="empty">No sleep entries yet.</div>')}`}
function saveSleep(){let b=$('sleepBed').value,w=$('sleepWake').value;if(!b||!w)return alert('Enter bedtime and wake time.');let [bh,bm]=b.split(':').map(Number),[wh,wm]=w.split(':').map(Number),mins=(wh*60+wm)-(bh*60+bm);if(mins<0)mins+=1440;db.sleep.push({date:$('sleepDate').value||today(),bed:b,wake:w,hours:mins/60});save()}
function study(){return `<h2>Study & GCSE tracker</h2>${card('Log revision',`<div class="formgrid">${field('Date','studyDate','date','',today())}${field('Subject','studySubject','text','e.g. Maths')}${field('Minutes studied','studyMinutes','number','')}${field('Topic','studyTopic','text','Topic revised')}</div><label>Confidence / notes</label><textarea id="studyNotes"></textarea><button class="btn primary" style="margin-top:10px" onclick="saveStudy()">Save revision</button>`)}${card('Revision history',db.study.slice().reverse().map(s=>`<div class="historyitem"><b>${esc(s.subject)}</b> · ${s.minutes} min · ${esc(s.date)}<div class="muted small">${esc(s.topic)} ${esc(s.notes)}</div></div>`).join('')||'<div class="empty">No revision logged yet.</div>')}`}
function saveStudy(){db.study.push({date:$('studyDate').value||today(),subject:$('studySubject').value,minutes:+$('studyMinutes').value||0,topic:$('studyTopic').value,notes:$('studyNotes').value});save()}

function measurements(){return `<h2>Body measurements</h2>${card('Add measurement',`<div class="formgrid">${field('Date','measureDate','date','',today())}${field('Height (cm)','measureHeight','number','')}${field('Waist (cm)','measureWaist','number','')}${field('Chest (cm)','measureChest','number','')}${field('Arm (cm)','measureArm','number','')}${field('Shoulders (cm)','measureShoulders','number','')}${field('Thigh (cm)','measureThigh','number','')}${field('Weight (kg)','measureWeight','number','')}</div><label>Notes (optional)</label><textarea id="measureNotes" placeholder="Optional context"></textarea><button class="btn primary" style="margin-top:10px" onclick="saveMeasurement()">Save measurements</button><p class="muted small">Measurements are optional progress records. There is no need to measure frequently.</p>`)}${card('Measurement history',db.measurements.slice().reverse().map(m=>`<div class="historyitem"><b>${esc(m.date)}</b><div class="muted small">${[['Weight',m.weight,'kg'],['Height',m.height,'cm'],['Waist',m.waist,'cm'],['Chest',m.chest,'cm'],['Arm',m.arm,'cm'],['Shoulders',m.shoulders,'cm'],['Thigh',m.thigh,'cm']].filter(x=>x[1]!==''&&x[1]!==null&&x[1]!==undefined).map(x=>`${x[0]}: ${x[1]} ${x[2]}`).join(' · ')}</div>${m.notes?`<div class="muted small">${esc(m.notes)}</div>`:''}</div>`).join('')||'<div class="empty">No measurements saved yet.</div>')}`}
function saveMeasurement(){db.measurements.push({date:$('measureDate').value||today(),height:$('measureHeight').value,waist:$('measureWaist').value,chest:$('measureChest').value,arm:$('measureArm').value,shoulders:$('measureShoulders').value,thigh:$('measureThigh').value,weight:$('measureWeight').value,notes:$('measureNotes').value});save()}

function spending(){return `<h2>Shopping & spending</h2>${card('Add purchase',`<div class="formgrid">${field('Date','spDate','date','',today())}${field('Item','spItem','text','What did you buy?')}${field('Amount (£)','spAmount','number','0.00')}${field('Category','spCategory','text','Food, travel, etc.')}</div><button class="btn primary" style="margin-top:10px" onclick="saveSpend()">Save purchase</button>`)}${card('This month',`<div class="stat">£${db.spending.filter(s=>s.date.slice(0,7)===today().slice(0,7)).reduce((a,s)=>a+s.amount,0).toFixed(2)}</div>`)}${card('Purchase history',db.spending.slice().reverse().map(s=>`<div class="tableline"><span>${esc(s.date)} · ${esc(s.item)} <span class="muted">(${esc(s.category)})</span></span><b>£${s.amount.toFixed(2)}</b></div>`).join('')||'<div class="empty">No purchases logged.</div>')}`}
function saveSpend(){db.spending.push({date:$('spDate').value||today(),item:$('spItem').value,amount:+$('spAmount').value||0,category:$('spCategory').value});save()}
function calendar(){return `<h2>Calendar</h2>${card('Add event',`<div class="formgrid">${field('Date','evDate','date','',today())}${field('Event','evName','text','Training, exam, appointment')}</div><button class="btn primary" style="margin-top:10px" onclick="saveEvent()">Add event</button>`)}${card('Upcoming events',db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="tableline"><span>${esc(e.date)} · ${esc(e.name)}</span><button class="btn danger small" onclick="removeItem('events','${e.id}')">Delete</button></div>`).join('')||'<div class="empty">No events yet.</div>')}`}
function saveEvent(){db.events.push({id:uid(),date:$('evDate').value||today(),name:$('evName').value});save()}
function removeItem(key,id){db[key]=db[key].filter(x=>x.id!==id);save()}
function reports(){let sessions=db.gym.filter(x=>withinWeek(x.date)).length,mins=db.study.filter(x=>withinWeek(x.date)).reduce((a,x)=>a+x.minutes,0),runs=db.runs.filter(x=>withinWeek(x.date)).length,boxes=db.boxing.filter(x=>withinWeek(x.date)).length;return `<h2>Weekly report</h2><div class="grid">${card('Gym',`<div class="stat">${sessions}</div><span class="muted small">sessions this week</span>`)}${card('Boxing',`<div class="stat">${boxes}</div><span class="muted small">sessions this week</span>`)}${card('Running',`<div class="stat">${runs}</div><span class="muted small">runs this week</span>`)}${card('Study',`<div class="stat">${mins}</div><span class="muted small">revision minutes</span>`)}</div>${card('Personal records',Object.entries(prs()).map(([name,p])=>`<div class="tableline"><span>${esc(name)}</span><b>${p.weight} kg × ${p.reps}</b></div>`).join('')||'<div class="empty">Log gym sessions to build your records.</div>')}${card('Backup & data',`<p class="muted small">Your tracker data is stored in this browser on this iPhone. Export a backup regularly. Clearing website data may erase your records.</p><div class="row wrap"><button class="btn primary" onclick="exportData()">Export backup</button><label class="btn">Import backup<input class="hidden" type="file" accept="application/json" onchange="importData(event)"></label></div><button class="btn danger" style="margin-top:10px" onclick="clearData()">Clear all Northstar data</button>`)}`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='northstar-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db={...fresh(),...JSON.parse(r.result)};localStorage.setItem(KEY,JSON.stringify(db));render();alert('Backup imported.')}catch(err){alert('That backup file could not be read.')}};r.readAsText(f)}
function clearData(){if(confirm('Delete all Northstar data from this browser? Export a backup first if you want to keep it.')){db=fresh();save()}}
function render(){ $('todayLabel').innerHTML=dateLabel(today());$('nav').innerHTML=navItems.map(([p,ic])=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span>${ic}</span>${p}</button>`).join('');let views={Home:home,Gym:gym,Boxing:boxing,Running:running,Nutrition:nutrition,Habits:habits,Goals:goals,Calendar:calendar,Sleep:sleep,Study:study,Spending:spending,Reports:reports};$('view').innerHTML=(views[page]||home)();if(page==='Gym')drawGymChart()}
load();render();
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
